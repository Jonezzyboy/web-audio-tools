<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Sound Designer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141a26'/%3E%3Cpath d='M4 16h5l3-8 4 16 4-12 2 4h6' fill='none' stroke='%23ffb000' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="theme.css">
  <style>
    .control-group {
      margin-bottom: 18px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .hint {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    /* Two taps drawn to scale: x = gap, height = pitch, tail = decay */
    #tapScreen {
      position: relative;
      height: 112px;
      --tail: 40px;
    }

    #tapScreen::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 22px;
      border-top: 1px solid var(--screen-line);
    }

    .tap {
      position: absolute;
      bottom: 22px;
      width: 3px;
      background: var(--signal);
      border-radius: 2px 2px 0 0;
      transition: left 0.15s, height 0.15s;
    }

    .tap::after {
      content: "";
      position: absolute;
      left: 3px;
      bottom: 0;
      width: var(--tail);
      height: 100%;
      background: linear-gradient(to right, var(--signal-dim), transparent);
      clip-path: polygon(0 0, 100% 100%, 0 100%);
      transition: width 0.15s;
    }

    #tapScreen.flash .tap {
      box-shadow: 0 0 12px var(--signal);
    }

    .tap-readout {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 4px;
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: color-mix(in srgb, var(--signal) 70%, transparent);
    }
  </style>
</head>
<body>

<div class="container">
  <a class="back-link" href="../index.html">← All tools</a>
  <div class="tool-head">
    <h1>Notification Designer</h1>
  </div>

  <div class="screen" id="tapScreen" aria-hidden="true">
    <div class="tap" id="tap1"></div>
    <div class="tap" id="tap2"></div>
    <div class="tap-readout"><span id="tapFreqs"></span><span id="tapGap"></span></div>
  </div>

  <div class="control-group">
    <div class="label-row">
      <label for="pitch">Base pitch</label>
      <span id="pitchVal" class="value-display">440 Hz</span>
    </div>
    <input type="range" id="pitch" min="200" max="800" value="440">
  </div>

  <div class="control-group">
    <div class="label-row">
      <label for="interval">Second tap interval</label>
      <span id="intervalVal" class="value-display">1.2x</span>
    </div>
    <input type="range" id="interval" min="1.0" max="2.0" step="0.05" value="1.19">
    <small class="hint">1.2 is a minor third, 1.5 a perfect fifth</small>
  </div>

  <div class="control-group">
    <div class="label-row">
      <label for="speed">Gap between taps</label>
      <span id="speedVal" class="value-display">120 ms</span>
    </div>
    <input type="range" id="speed" min="50" max="400" step="10" value="120">
  </div>

  <div class="control-group">
    <div class="label-row">
      <label for="decay">Decay</label>
      <span id="decayVal" class="value-display">Short</span>
    </div>
    <input type="range" id="decay" min="1" max="3" step="1" value="2">
  </div>

  <span class="section-label">Presets</span>
  <div class="preset-row">
    <button class="preset-btn" data-preset="ping">Ping</button>
    <button class="preset-btn" data-preset="success">Success</button>
    <button class="preset-btn" data-preset="alert">Alert</button>
    <button class="preset-btn" data-preset="bubble">Bubble</button>
  </div>

  <div class="btn-row">
    <button id="playBtn" class="btn-primary">▶ Play</button>
    <button id="downloadBtn" class="btn-secondary">Download WAV</button>
  </div>
</div>

<script>
  // --- UI References ---
  const els = {
    pitch:       document.getElementById('pitch'),
    interval:    document.getElementById('interval'),
    speed:       document.getElementById('speed'),
    decay:       document.getElementById('decay'),
    valPitch:    document.getElementById('pitchVal'),
    valInterval: document.getElementById('intervalVal'),
    valSpeed:    document.getElementById('speedVal'),
    valDecay:    document.getElementById('decayVal'),
    screen:      document.getElementById('tapScreen'),
    tap1:        document.getElementById('tap1'),
    tap2:        document.getElementById('tap2'),
    tapFreqs:    document.getElementById('tapFreqs'),
    tapGap:      document.getElementById('tapGap')
  };

  // --- Update Displays ---
  const updateLabels = () =>
  {
    els.valPitch.innerText = `${els.pitch.value} Hz`;
    els.valInterval.innerText = `${els.interval.value}x`;
    els.valSpeed.innerText = `${els.speed.value} ms`;

    const decayMap = ['Tight', 'Normal', 'Ringing'];
    els.valDecay.innerText = decayMap[parseInt(els.decay.value) - 1];

    drawTaps();
  };

  function drawTaps()
  {
    const pitch = parseInt(els.pitch.value);
    const second = pitch * parseFloat(els.interval.value);
    const gap = parseInt(els.speed.value);
    const heightFor = hz => `${Math.min(84, 20 + Math.log2(hz / 200) / 3 * 64)}px`;

    els.tap1.style.left = '14%';
    els.tap2.style.left = `${14 + (gap / 400) * 60}%`;
    els.tap1.style.height = heightFor(pitch);
    els.tap2.style.height = heightFor(second);
    els.screen.style.setProperty('--tail', `${parseInt(els.decay.value) * 28}px`);
    els.tapFreqs.innerText = `${pitch} Hz, ${Math.round(second)} Hz`;
    els.tapGap.innerText = `${gap} ms`;
  }

  [els.pitch, els.interval, els.speed, els.decay].forEach(el => el.addEventListener('input', updateLabels));
  updateLabels(); // Init

  // --- THE CORE AUDIO ENGINE ---
  // This logic is shared by both Play and Download to ensure consistency
  function scheduleSound(ctx, destination, startTime)
  {
    const basePitch = parseInt(els.pitch.value);
    const interval = parseFloat(els.interval.value);
    const gap = parseInt(els.speed.value) / 1000; // ms to seconds
    const decaySetting = parseInt(els.decay.value);

    // Decay Multipliers: 1=Fast, 2=Medium, 3=Slow
    const decay1 = 0.1 * (decaySetting * 0.7);
    const decay2 = 0.25 * (decaySetting * 0.7);

    // Helper to create one "Pluck"
    const triggerOsc = (time, freq, dur) =>
    {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, time);

      // Envelope
      gain.gain.setValueAtTime(0, time);
      gain.gain.linearRampToValueAtTime(0.1, time + 0.01); // Fast attack
      gain.gain.exponentialRampToValueAtTime(0.001, time + dur); // Decay

      osc.connect(gain);
      gain.connect(destination);

      osc.start(time);
      osc.stop(time + dur + 0.1);
    };

    // Tap 1
    triggerOsc(startTime, basePitch, decay1);

    // Tap 2 (Higher pitch, slightly longer)
    triggerOsc(startTime + gap, basePitch * interval, decay2);

    return startTime + gap + decay2; // Return end time
  }

  // --- PLAY PREVIEW ---
  function playPreview()
  {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioContext();
    const now = ctx.currentTime;

    els.screen.classList.add('flash');
    setTimeout(() => els.screen.classList.remove('flash'), 250);

    scheduleSound(ctx, ctx.destination, now);
  }

  document.getElementById('playBtn').addEventListener('click', playPreview);

  // --- PRESETS ---
  const PRESETS = {
    ping:    {pitch: 700, interval: 1.5,  speed: 90,  decay: 2},
    success: {pitch: 520, interval: 1.25, speed: 130, decay: 2},
    alert:   {pitch: 440, interval: 1.0,  speed: 220, decay: 1},
    bubble:  {pitch: 300, interval: 1.2,  speed: 150, decay: 3}
  };

  document.querySelectorAll('.preset-btn').forEach(btn =>
  {
    btn.addEventListener('click', () =>
    {
      const p = PRESETS[btn.dataset.preset];
      els.pitch.value = p.pitch;
      els.interval.value = p.interval;
      els.speed.value = p.speed;
      els.decay.value = p.decay;
      updateLabels();
      playPreview();
    });
  });

  // --- DOWNLOAD WAV (Offline Rendering) ---
  document.getElementById('downloadBtn').addEventListener('click', async () =>
  {
    const btn = document.getElementById('downloadBtn');
    const originalText = btn.innerText;
    btn.innerText = 'Rendering…';

    try
    {
      // 1. Setup Offline Context (High res: 44.1kHz)
      const sampleRate = 44100;
      const duration = 1.5; // Seconds
      const ctx = new OfflineAudioContext(1, sampleRate * duration, sampleRate);

      // 2. Schedule sound (with small padding at start to prevent clipping)
      scheduleSound(ctx, ctx.destination, 0.1);

      // 3. Render
      const renderedBuffer = await ctx.startRendering();

      // 4. Convert to WAV and Download
      const wavBytes = bufferToWave(renderedBuffer, 0.0, duration);
      const blob = new Blob([wavBytes], {type: 'audio/wav'});
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = `notification_${els.pitch.value}hz.wav`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
    }
    catch(err)
    {
      console.error(err);
    }
    finally
    {
      btn.innerText = originalText;
    }
  });

  // --- WAV HEADER HELPER (Standard Boilerplate) ---
  function bufferToWave(abuffer, offset, len)
  {
    let numOfChan = abuffer.numberOfChannels,
      length = len * abuffer.sampleRate * numOfChan * 2 + 44,
      buffer = new ArrayBuffer(length),
      view = new DataView(buffer),
      channels = [], i, sample,
      pos = 0;

    setUint32(0x46464952);
    setUint32(length - 8);
    setUint32(0x45564157); // RIFF, length, WAVE
    setUint32(0x20746d66);
    setUint32(16);
    setUint16(1);
    setUint16(numOfChan); // fmt, pcm
    setUint32(abuffer.sampleRate);
    setUint32(abuffer.sampleRate * 2 * numOfChan);
    setUint16(numOfChan * 2);
    setUint16(16);
    setUint32(0x61746164);
    setUint32(length - pos - 4); // data

    for(i = 0; i < abuffer.numberOfChannels; i++)
    {
      channels.push(abuffer.getChannelData(i));
    }

    while(pos < length)
    {
      for(i = 0; i < numOfChan; i++)
      {
        sample = Math.max(-1, Math.min(1, channels[i][offset]));
        sample = Math.round(sample < 0 ? sample * 32768 : sample * 32767);
        view.setInt16(pos, sample, true);
        pos += 2;
      }
      offset++;
    }
    return buffer;

    function setUint16(data)
    {
      view.setUint16(pos, data, true);
      pos += 2;
    }

    function setUint32(data)
    {
      view.setUint32(pos, data, true);
      pos += 4;
    }
  }
</script>
</body>
</html>
