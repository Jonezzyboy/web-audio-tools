<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAV to MP3 Converter</title>
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141a26'/%3E%3Cpath d='M4 16h5l3-8 4 16 4-12 2 4h6' fill='none' stroke='%23ffb000' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="theme.css">
  <style>
    .drop-zone {
      display: grid;
      place-items: center;
      gap: 6px;
      text-align: center;
      border: 1.5px dashed var(--line);
      padding: 36px 20px;
      border-radius: var(--radius-sm);
      margin-bottom: 18px;
      cursor: pointer;
      background: var(--inset);
      transition: border-color 0.12s, background-color 0.12s;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 6%, var(--inset));
    }

    .drop-zone svg {
      width: 28px;
      height: 28px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .drop-zone p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      pointer-events: none;
    }

    .drop-zone strong {
      color: var(--ink);
      font-weight: 600;
    }

    input[type="file"] {
      display: none;
    }

    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    #status {
      margin-top: 16px;
      font-size: 0.9rem;
      min-height: 1.4em;
      display: flex;
      align-items: center;
    }

    #status:empty {
      margin-top: 0;
    }

    .success {
      color: var(--ok);
    }

    .error {
      color: var(--danger);
    }

    .processing {
      color: var(--ink);
    }

    .loader {
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      margin-right: 8px;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>

<div class="card">
  <a class="back-link" href="../index.html">← All tools</a>
  <div class="tool-head">
    <h1>WAV to MP3</h1>
  </div>

  <div class="drop-zone" id="dropZone" role="button" tabindex="0">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
    <p><strong>Drop WAV files here</strong><br>or click to choose files</p>
  </div>
  <input type="file" id="fileInput" accept="audio/wav, audio/x-wav" multiple>

  <div class="options-row">
    <label for="bitrate">MP3 bitrate</label>
    <select id="bitrate" class="num-input">
      <option value="96">96 kbps</option>
      <option value="128" selected>128 kbps</option>
      <option value="192">192 kbps</option>
      <option value="320">320 kbps</option>
    </select>
  </div>

  <div id="status"></div>
</div>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const status = document.getElementById('status');

  // --- UI Handling ---
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('keydown', (e) =>
  {
    if(e.key === 'Enter' || e.key === ' ')
    {
      e.preventDefault();
      fileInput.click();
    }
  });

  dropZone.addEventListener('dragover', (e) =>
  {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

  dropZone.addEventListener('drop', (e) =>
  {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if(e.dataTransfer.files.length)
    {
      handleFiles(e.dataTransfer.files);
    }
  });

  fileInput.addEventListener('change', (e) =>
  {
    if(e.target.files.length)
    {
      handleFiles(e.target.files);
    }
    // Reset so selecting the same file again re-fires 'change'
    fileInput.value = '';
  });

  // --- Conversion Logic ---
  function isWav(file)
  {
    return file.type.includes('wav') || /\.wav$/i.test(file.name);
  }

  async function handleFiles(fileList)
  {
    const files = Array.from(fileList).filter(isWav);
    if(!files.length)
    {
      showStatus('Those files aren’t WAVs. Choose .wav files to convert.', 'error');
      return;
    }

    const kbps = parseInt(document.getElementById('bitrate').value, 10);
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let converted = 0;

    try
    {
      for(const file of files)
      {
        showStatus(
          `<span class="loader"></span>Converting ${escapeHtml(file.name)} (${converted + 1} of ${files.length})…`,
          'processing'
        );

        const arrayBuffer = await file.arrayBuffer();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        const mp3Blob = convertBufferToMp3(audioBuffer, kbps);

        downloadBlob(mp3Blob, file.name.replace(/\.wav$/i, '') + '.mp3');
        converted++;
      }

      showStatus(`Converted ${converted} file${converted > 1 ? 's' : ''} to MP3.`, 'success');
    }
    catch(err)
    {
      console.error(err);
      showStatus(`Couldn’t convert file ${converted + 1} of ${files.length}. It may be corrupt or an unsupported WAV format.`, 'error');
    }
    finally
    {
      audioCtx.close();
    }
  }

  function downloadBlob(blob, filename)
  {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => window.URL.revokeObjectURL(url), 1000);
  }

  function escapeHtml(text)
  {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function showStatus(msg, type)
  {
    status.innerHTML = msg;
    status.className = type;
  }

  // --- THE LAMEJS ENCODER HELPER ---
  // Convert Float32 (-1.0 to 1.0) to Int16 (-32768 to 32767)
  // LAME requires Integer PCM input
  function floatTo16(samples)
  {
    const out = new Int16Array(samples.length);
    for(let i = 0; i < samples.length; i++)
    {
      const s = Math.max(-1, Math.min(1, samples[i]));
      out[i] = Math.round(s < 0 ? s * 0x8000 : s * 0x7FFF);
    }
    return out;
  }

  function convertBufferToMp3(buffer, kbps)
  {
    const channels = Math.min(2, buffer.numberOfChannels);
    const mp3encoder = new lamejs.Mp3Encoder(channels, buffer.sampleRate, kbps);
    const mp3Data = [];

    const left = floatTo16(buffer.getChannelData(0));
    const right = channels === 2 ? floatTo16(buffer.getChannelData(1)) : null;

    // Encode in chunks
    const sampleBlockSize = 1152; // multiple of 576
    for(let i = 0; i < left.length; i += sampleBlockSize)
    {
      const leftChunk = left.subarray(i, i + sampleBlockSize);
      const mp3buf = right
        ? mp3encoder.encodeBuffer(leftChunk, right.subarray(i, i + sampleBlockSize))
        : mp3encoder.encodeBuffer(leftChunk);
      if(mp3buf.length > 0)
      {
        mp3Data.push(mp3buf);
      }
    }

    // Finish
    const mp3buf = mp3encoder.flush();
    if(mp3buf.length > 0)
    {
      mp3Data.push(mp3buf);
    }

    return new Blob(mp3Data, {type: 'audio/mp3'});
  }
</script>

</body>
</html>
